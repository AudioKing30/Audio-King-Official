<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · AudioKing Pro Audio</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #151C2C;
      --border: #232E47;
      --orange: #FF6A00;
      --orange-hover: #E55F00;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --success: #10B981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(255, 106, 0, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(14, 165, 233, 0.05) 0%, transparent 40%);
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 2px 10px rgba(255, 106, 0, 0.3);
    }
    .brand-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFF;
    }
    .brand-name span {
      color: var(--orange);
    }
    .login-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }
    .alert-banner {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #FECACA;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .form-input {
      width: 100%;
      height: 44px;
      background: #0B0F19;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      color: #FFF;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.15);
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      padding: 4px;
    }
    .password-toggle:hover {
      color: #FFF;
    }
    .submit-btn {
      width: 100%;
      height: 46px;
      background: var(--orange);
      color: #FFF;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .submit-btn:hover {
      background: var(--orange-hover);
    }
    .submit-btn:active {
      transform: scale(0.99);
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: #64748B;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }
    .security-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #64748B;
      font-size: 11px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="brand-badge">
        <img src="/assets/images/logo.jpg" alt="AudioKing" class="brand-logo">
        <div class="brand-name">AUDIO<span>KING</span></div>
      </div>
      <h1 class="login-title">Admin Portal</h1>
      <p class="login-subtitle">Store Owner &amp; Catalog Management</p>
    </div>

    <div id="alertBanner" class="alert-banner"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="adminEmail" class="form-label">Admin Email or Username</label>
        <div class="input-wrapper">
          <input 
            type="text" 
            id="adminEmail" 
            class="form-input" 
            required 
            placeholder="admin@audioking.in" 
            value="" 
            autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <div class="input-wrapper">
          <input 
            type="password" 
            id="adminPassword" 
            class="form-input" 
            required 
            placeholder="••••••••••••" 
            value="" 
            autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePasswordBtn" onclick="togglePasswordVisibility()">Show</button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span>Sign In to Admin Panel</span>
      </button>

      <div class="security-notice">
        <span>🔒 Secure 256-bit encrypted administrator session</span>
      </div>
    </form>

    <div class="login-footer">
      <a href="../#home" style="color: var(--text-muted); text-decoration: none;">&larr; Return to Customer Storefront</a>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('adminPassword');
      const btn = document.getElementById('togglePasswordBtn');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.textContent = 'Hide';
      } else {
        pwd.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function getApiUrl(endpoint) {
      let base = '';
      if (window.AUDIOKING_API_URL) base = String(window.AUDIOKING_API_URL).trim().replace(/\/+$/, '');
      else {
        try {
          const saved = localStorage.getItem('audioking_api_url');
          if (saved) base = String(saved).trim().replace(/\/+$/, '');
        } catch (e) {}
      }
      if (!base && window.location.hostname.includes('github.io')) {
        base = 'https://audioking-api.onrender.com';
      } else if (!base && (window.location.protocol === 'file:' || (window.location.port && window.location.port !== '3000'))) {
        base = 'http://localhost:3000';
      }
      return `${base}${endpoint.startsWith('/') ? endpoint : '/' + endpoint}`;
    }

    // Proactively prewarm server on admin login page load
    try {
      fetch(getApiUrl('/api/health'), { method: 'GET', keepalive: true }).catch(() => {});
    } catch (e) {}

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const alertBanner = document.getElementById('alertBanner');
      const submitBtn = document.getElementById('submitBtn');

      alertBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying credentials...</span>';

      const maxAttempts = 3;

      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          if (attempt > 1) {
            submitBtn.innerHTML = `<span>Server waking up (attempt ${attempt}/${maxAttempts})...</span>`;
          }
          const res = await fetch(getApiUrl('/api/admin/auth/login'), {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const isJson = (res.headers.get('content-type') || '').includes('application/json');
          const data = isJson ? await res.json().catch(() => ({})) : {};

          if (res.ok && data.success) {
            if (data.token) {
              localStorage.setItem('audioking_admin_token', data.token);
              localStorage.setItem('audioKingSessionToken', data.token);
              localStorage.setItem('audioking_token', data.token);
              localStorage.setItem('audioKingToken', data.token);
            }
            if (data.user) {
              localStorage.setItem('audioKingUser', JSON.stringify(data.user));
              localStorage.setItem('audioking_user', JSON.stringify(data.user));
            }
            submitBtn.innerHTML = '<span>Success! Redirecting...</span>';
            window.location.href = '../#admin';
            return;
          }

          // Real credential errors (404, 401, 400, 403) - do NOT retry
          if (res.status === 404 || res.status === 401 || res.status === 400 || res.status === 403) {
            alertBanner.textContent = data.error || (res.status === 404 ? 'This user is not registered yet. Please register your account first.' : 'Authentication failed. Please verify credentials.');
            alertBanner.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Sign In to Admin Panel</span>';
            return;
          }

          // Cold start gateway responses (502, 503, 504) - retry
          if (res.status === 502 || res.status === 503 || res.status === 504) {
            if (attempt < maxAttempts) {
              await new Promise(r => setTimeout(r, 2200));
              continue;
            }
          }

          alertBanner.textContent = data.error || 'Authentication failed. Please verify credentials.';
          alertBanner.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In to Admin Panel</span>';
          return;
        } catch (err) {
          if (attempt < maxAttempts) {
            await new Promise(r => setTimeout(r, 2200));
            continue;
          }
          alertBanner.textContent = 'Unable to connect to authentication server. Please check your internet connection and try again.';
          alertBanner.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Sign In to Admin Panel</span>';
          return;
        }
      }
    }

    // Auto-check if already logged in as admin with a valid session token
    (async () => {
      try {
        const token = localStorage.getItem('audioKingSessionToken') || localStorage.getItem('audioking_token');
        if (!token) return;

        const local = localStorage.getItem('audioKingUser') || localStorage.getItem('audioking_user');
        if (local) {
          try {
            const u = JSON.parse(local);
            if (u && u.role === 'admin') {
              window.location.href = '../#admin';
              return;
            }
          } catch (e) {}
        }
        const headers = { 'Authorization': `Bearer ${token}` };
        const res = await fetch(getApiUrl('/api/admin/auth/me'), {
          credentials: 'include',
          headers
        });
        if (res.ok) {
          const data = await res.json();
          if (data.user && data.user.role === 'admin') {
            window.location.href = '../#admin';
          }
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
