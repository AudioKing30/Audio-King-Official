<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="installSpk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="commShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#commShadow)">
    <!-- Left Speaker Cabinet -->
    <rect x="36" y="44" width="38" height="74" rx="6" fill="url(#installSpk)" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Left Tweeter -->
    <circle cx="55" cy="62" r="7" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <circle cx="55" cy="62" r="3.5" fill="#3B82F6"/>
    <!-- Left Woofer -->
    <circle cx="55" cy="94" r="14" fill="#0F172A" stroke="#64748B" stroke-width="1.2"/>
    <circle cx="55" cy="94" r="5" fill="#CBD5E1"/>
    <!-- Right Speaker Cabinet -->
    <rect x="86" y="44" width="38" height="74" rx="6" fill="url(#installSpk)" stroke="#0F172A" stroke-width="1.5"/>
    <!-- Right Tweeter -->
    <circle cx="105" cy="62" r="7" fill="#0F172A" stroke="#64748B" stroke-width="1"/>
    <circle cx="105" cy="62" r="3.5" fill="#3B82F6"/>
    <!-- Right Woofer -->
    <circle cx="105" cy="94" r="14" fill="#0F172A" stroke="#64748B" stroke-width="1.2"/>
    <circle cx="105" cy="94" r="5" fill="#CBD5E1"/>
    <!-- Wall Brackets -->
    <rect x="30" y="76" width="6" height="10" rx="1" fill="#64748B"/>
    <rect x="124" y="76" width="6" height="10" rx="1" fill="#64748B"/>
  </g>
</svg>