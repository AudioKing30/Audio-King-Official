<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="hpHeadband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="hpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#hpShadow)">
    <!-- Headband Arch -->
    <path d="M42,92 C42,42 118,42 118,92" fill="none" stroke="url(#hpHeadband)" stroke-width="10" stroke-linecap="round"/>
    <path d="M48,82 C48,48 112,48 112,82" fill="none" stroke="#F8FAFC" stroke-width="1.5" opacity="0.3"/>
    <!-- Left Metal Gimbal / Slider -->
    <line x1="42" y1="86" x2="42" y2="102" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Metal Gimbal / Slider -->
    <line x1="118" y1="86" x2="118" y2="102" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Earcup Cushion -->
    <ellipse cx="42" cy="108" rx="11" ry="19" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="44" cy="108" rx="7" ry="14" fill="#1E293B"/>
    <!-- Left Outer Shell Cap -->
    <path d="M34,92 C32,92 28,100 28,108 C28,116 32,124 34,124 Z" fill="#F97316"/>
    <!-- Right Earcup Cushion -->
    <ellipse cx="118" cy="108" rx="11" ry="19" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="116" cy="108" rx="7" ry="14" fill="#1E293B"/>
    <!-- Right Outer Shell Cap -->
    <path d="M126,92 C128,92 132,100 132,108 C132,116 128,124 126,124 Z" fill="#F97316"/>
    <!-- Detachable 3.5mm Cable -->
    <path d="M42,126 C42,138 60,146 80,146" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>