<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <radialGradient id="bigKnob" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </radialGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#shadowBox)" transform="translate(0, 0)">
    <!-- Main Interface Shell -->
    <rect x="36" y="38" width="88" height="84" rx="8" fill="url(#chassis)" stroke="#374151" stroke-width="1.5"/>
    <!-- Top Branding Plate -->
    <rect x="42" y="44" width="76" height="10" rx="3" fill="#111827"/>
    <text x="80" y="51.5" fill="#9CA3AF" font-family="sans-serif" font-size="4.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">AUDIOKING PRO</text>
    <!-- Center Big Knob Outer Ring -->
    <circle cx="80" cy="80" r="22" fill="#111827" stroke="#4B5563" stroke-width="1"/>
    <!-- LED Ring -->
    <circle cx="80" cy="80" r="19" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-dasharray="3 2" stroke-linecap="round"/>
    <!-- Big Rotary Knob -->
    <circle cx="80" cy="80" r="15.5" fill="url(#bigKnob)" stroke="#9CA3AF" stroke-width="1"/>
    <line x1="80" y1="80" x2="80" y2="67" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
    <!-- Left Input Meters -->
    <rect x="44" y="68" width="6" height="24" rx="2" fill="#111827"/>
    <line x1="47" y1="71" x2="47" y2="76" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="47" y1="78" x2="47" y2="84" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
    <line x1="47" y1="86" x2="47" y2="90" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Output Meters -->
    <rect x="110" y="68" width="6" height="24" rx="2" fill="#111827"/>
    <line x1="113" y1="71" x2="113" y2="76" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="113" y1="78" x2="113" y2="84" stroke="#EAB308" stroke-width="3" stroke-linecap="round"/>
    <line x1="113" y1="86" x2="113" y2="90" stroke="#22C55E" stroke-width="3" stroke-linecap="round"/>
    <!-- Lower Buttons & Jacks -->
    <circle cx="50" cy="110" r="3" fill="#111827" stroke="#6B7280" stroke-width="1"/>
    <circle cx="62" cy="110" r="3" fill="#111827" stroke="#6B7280" stroke-width="1"/>
    <circle cx="98" cy="110" r="3" fill="#111827" stroke="#6B7280" stroke-width="1"/>
    <circle cx="110" cy="110" r="3" fill="#111827" stroke="#6B7280" stroke-width="1"/>
    <!-- Headphone Output -->
    <circle cx="80" cy="110" r="4.5" fill="#111827" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="80" cy="110" r="2" fill="#000000"/>
  </g>
</svg>