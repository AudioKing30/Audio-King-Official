<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="pedalChassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="45%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stompChrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="pedalLed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="35%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <filter id="pedalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#pedalShadow)" transform="translate(0, -2)">
    <!-- Side 1/4" Audio Jacks -->
    <rect x="42" y="70" width="4" height="12" rx="1.5" fill="#64748B"/>
    <rect x="114" y="70" width="4" height="12" rx="1.5" fill="#64748B"/>
    <!-- Main Stompbox Diecast Housing -->
    <rect x="45" y="26" width="70" height="110" rx="8" fill="url(#pedalChassis)" stroke="#0C4A6E" stroke-width="1.5"/>
    <rect x="48" y="29" width="64" height="104" rx="6" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.4"/>
    <!-- Upper Control Recess Area -->
    <rect x="50" y="32" width="60" height="42" rx="5" fill="#090E17" stroke="#1E293B" stroke-width="1"/>
    <!-- Status LED -->
    <circle cx="80" cy="40" r="3.5" fill="url(#pedalLed)"/>
    <circle cx="79" cy="39" r="1" fill="#FFFFFF" opacity="0.8"/>
    <!-- 3 Control Knobs -->
    <!-- Knob 1: Level -->
    <circle cx="60" cy="56" r="7.5" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <line x1="60" y1="56" x2="57" y2="50" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Knob 2: Tone -->
    <circle cx="80" cy="56" r="7.5" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <line x1="80" y1="56" x2="80" y2="49" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Knob 3: Gain -->
    <circle cx="100" cy="56" r="7.5" fill="#1E293B" stroke="#64748B" stroke-width="1"/>
    <line x1="100" y1="56" x2="103" y2="50" stroke="#F8FAFC" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Model Text -->
    <text x="80" y="70" fill="#38BDF8" font-family="sans-serif" font-size="4" font-weight="800" text-anchor="middle" letter-spacing="0.8">OVERDRIVE FX</text>
    <!-- Lower Footswitch Step Pad -->
    <rect x="52" y="80" width="56" height="48" rx="5" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <!-- Rubber Tread Grooves -->
    <line x1="56" y1="87" x2="104" y2="87" stroke="#09090B" stroke-width="1.2"/>
    <line x1="56" y1="92" x2="104" y2="92" stroke="#09090B" stroke-width="1.2"/>
    <line x1="56" y1="97" x2="104" y2="97" stroke="#09090B" stroke-width="1.2"/>
    <!-- Chrome Heavy-Duty Stomp Switch -->
    <circle cx="80" cy="109" r="10" fill="#09090B" stroke="#334155" stroke-width="1.2"/>
    <circle cx="80" cy="109" r="7.5" fill="url(#stompChrome)"/>
    <circle cx="80" cy="109" r="5" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.8"/>
    <circle cx="78.5" cy="107.5" r="1.5" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>