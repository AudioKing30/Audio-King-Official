<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="mixerBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="faderKnob" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="mixerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#mixerShadow)" transform="translate(0, -2)">
    <!-- Mixer Chassis (Angled Desktop Console) -->
    <rect x="30" y="30" width="100" height="102" rx="7" fill="url(#mixerBody)" stroke="#475569" stroke-width="1.5"/>
    
    <!-- Top Header Bar with Accent -->
    <rect x="30" y="30" width="100" height="10" rx="4" fill="#090E17"/>
    <line x1="36" y1="35" x2="60" y2="35" stroke="#EA580C" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Channel 1 Strip -->
    <rect x="36" y="44" width="16" height="82" rx="3" fill="#182234" opacity="0.6"/>
    <circle cx="44" cy="50" r="3" fill="#EF4444" stroke="#000" stroke-width="0.5"/>
    <circle cx="44" cy="59" r="2.6" fill="#3B82F6" stroke="#000" stroke-width="0.5"/>
    <circle cx="44" cy="68" r="2.6" fill="#3B82F6" stroke="#000" stroke-width="0.5"/>
    <circle cx="44" cy="77" r="2.4" fill="#E2E8F0" stroke="#000" stroke-width="0.5"/>
    <line x1="44" y1="86" x2="44" y2="120" stroke="#090E17" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="40" y="98" width="8" height="6" rx="1.5" fill="url(#faderKnob)" stroke="#475569" stroke-width="0.5"/>
    <line x1="40" y1="101" x2="48" y2="101" stroke="#000" stroke-width="1"/>

    <!-- Channel 2 Strip -->
    <rect x="55" y="44" width="16" height="82" rx="3" fill="#182234" opacity="0.6"/>
    <circle cx="63" cy="50" r="3" fill="#EF4444" stroke="#000" stroke-width="0.5"/>
    <circle cx="63" cy="59" r="2.6" fill="#3B82F6" stroke="#000" stroke-width="0.5"/>
    <circle cx="63" cy="68" r="2.6" fill="#3B82F6" stroke="#000" stroke-width="0.5"/>
    <circle cx="63" cy="77" r="2.4" fill="#E2E8F0" stroke="#000" stroke-width="0.5"/>
    <line x1="63" y1="86" x2="63" y2="120" stroke="#090E17" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="59" y="104" width="8" height="6" rx="1.5" fill="url(#faderKnob)" stroke="#475569" stroke-width="0.5"/>
    <line x1="59" y1="107" x2="67" y2="107" stroke="#000" stroke-width="1"/>

    <!-- Channel 3 Strip -->
    <rect x="74" y="44" width="16" height="82" rx="3" fill="#182234" opacity="0.6"/>
    <circle cx="82" cy="50" r="3" fill="#EF4444" stroke="#000" stroke-width="0.5"/>
    <circle cx="82" cy="59" r="2.6" fill="#3B82F6" stroke="#000" stroke-width="0.5"/>
    <circle cx="82" cy="68" r="2.6" fill="#3B82F6" stroke="#000" stroke-width="0.5"/>
    <circle cx="82" cy="77" r="2.4" fill="#E2E8F0" stroke="#000" stroke-width="0.5"/>
    <line x1="82" y1="86" x2="82" y2="120" stroke="#090E17" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="78" y="92" width="8" height="6" rx="1.5" fill="url(#faderKnob)" stroke="#475569" stroke-width="0.5"/>
    <line x1="78" y1="95" x2="86" y2="95" stroke="#000" stroke-width="1"/>

    <!-- Channel 4 / Master Section -->
    <rect x="94" y="44" width="30" height="82" rx="3" fill="#090E17"/>
    <!-- Dual LED VU Meters -->
    <rect x="100" y="50" width="3.5" height="24" rx="1" fill="#1E293B"/>
    <line x1="101.75" y1="52" x2="101.75" y2="55" stroke="#EF4444" stroke-width="2"/>
    <line x1="101.75" y1="57" x2="101.75" y2="61" stroke="#EAB308" stroke-width="2"/>
    <line x1="101.75" y1="63" x2="101.75" y2="72" stroke="#22C55E" stroke-width="2"/>

    <rect x="106" y="50" width="3.5" height="24" rx="1" fill="#1E293B"/>
    <line x1="107.75" y1="52" x2="107.75" y2="55" stroke="#EF4444" stroke-width="2"/>
    <line x1="107.75" y1="57" x2="107.75" y2="61" stroke="#EAB308" stroke-width="2"/>
    <line x1="107.75" y1="63" x2="107.75" y2="70" stroke="#22C55E" stroke-width="2"/>

    <!-- Master Fader -->
    <line x1="112" y1="86" x2="112" y2="120" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <rect x="107" y="94" width="10" height="7" rx="1.5" fill="#DC2626" stroke="#991B1B" stroke-width="0.6"/>
    <line x1="107" y1="97.5" x2="117" y2="97.5" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>