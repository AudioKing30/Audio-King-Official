<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="sunburst" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="45%" stop-color="#F77F00"/>
      <stop offset="75%" stop-color="#D62828"/>
      <stop offset="100%" stop-color="#2B1810"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C29B38"/>
      <stop offset="50%" stop-color="#E2B755"/>
      <stop offset="100%" stop-color="#A57F24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" transform="translate(0, -2)">
    <!-- Neck -->
    <rect x="76" y="24" width="8" height="60" fill="url(#neck)"/>
    <!-- Frets -->
    <line x1="76" y1="32" x2="84" y2="32" stroke="#4A3525" stroke-width="0.8"/>
    <line x1="76" y1="40" x2="84" y2="40" stroke="#4A3525" stroke-width="0.8"/>
    <line x1="76" y1="49" x2="84" y2="49" stroke="#4A3525" stroke-width="0.8"/>
    <line x1="76" y1="59" x2="84" y2="59" stroke="#4A3525" stroke-width="0.8"/>
    <line x1="76" y1="70" x2="84" y2="70" stroke="#4A3525" stroke-width="0.8"/>
    <!-- Headstock -->
    <path d="M75,24 L74,10 C74,7 77,5 80,5 C83,5 86,7 86,10 L85,24 Z" fill="#2B1810"/>
    <!-- Tuning Pegs -->
    <circle cx="71" cy="11" r="2.2" fill="#E2E8F0"/>
    <circle cx="71" cy="16" r="2.2" fill="#E2E8F0"/>
    <circle cx="71" cy="21" r="2.2" fill="#E2E8F0"/>
    <circle cx="89" cy="11" r="2.2" fill="#E2E8F0"/>
    <circle cx="89" cy="16" r="2.2" fill="#E2E8F0"/>
    <circle cx="89" cy="21" r="2.2" fill="#E2E8F0"/>
    <!-- Guitar Body -->
    <path d="M80,72 C74,72 65,76 63,84 C61,92 66,97 64,103 C60,111 50,118 53,130 C56,143 70,147 80,147 C90,147 104,143 107,130 C110,118 100,111 96,103 C94,97 99,92 97,84 C95,76 86,72 80,72 Z" fill="url(#sunburst)" stroke="#1A0E0A" stroke-width="1.5"/>
    <!-- Pickguard -->
    <path d="M84,88 C88,88 92,94 92,102 C90,105 84,106 84,106 Z" fill="#FFFDF0" opacity="0.9"/>
    <!-- Pickups -->
    <rect x="75" y="88" width="10" height="4.5" rx="1" fill="#1E293B" stroke="#CBD5E1" stroke-width="0.8"/>
    <rect x="75" y="100" width="10" height="4.5" rx="1" fill="#1E293B" stroke="#CBD5E1" stroke-width="0.8"/>
    <!-- Bridge -->
    <rect x="74" y="114" width="12" height="4" rx="0.8" fill="#94A3B8"/>
    <rect x="76" y="122" width="8" height="3" rx="0.5" fill="#64748B"/>
    <!-- Knobs -->
    <circle cx="91" cy="120" r="2.5" fill="#DAA520"/>
    <circle cx="95" cy="127" r="2.5" fill="#DAA520"/>
    <!-- Strings -->
    <line x1="78" y1="8" x2="78" y2="122" stroke="#FFFFFF" stroke-width="0.6" opacity="0.85"/>
    <line x1="79.5" y1="8" x2="79.5" y2="122" stroke="#FFFFFF" stroke-width="0.6" opacity="0.85"/>
    <line x1="80.5" y1="8" x2="80.5" y2="122" stroke="#FFFFFF" stroke-width="0.6" opacity="0.85"/>
    <line x1="82" y1="8" x2="82" y2="122" stroke="#FFFFFF" stroke-width="0.6" opacity="0.85"/>
  </g>
</svg>