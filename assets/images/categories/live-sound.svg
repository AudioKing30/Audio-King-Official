<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="paGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="35%" stop-color="#374151"/>
      <stop offset="70%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="paShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#paShadow)">
    <!-- Trapezoidal Speaker Enclosure -->
    <path d="M56,25 L104,25 L114,135 L46,135 Z" fill="url(#paGrad)" stroke="#111827" stroke-width="2"/>
    <!-- Front Steel Grille -->
    <path d="M59,28 L101,28 L110,132 L50,132 Z" fill="#111827" stroke="#4B5563" stroke-width="1"/>
    <!-- High-Frequency Waveguide / Horn -->
    <path d="M66,35 L94,35 L98,62 L62,62 Z" fill="#030712" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="80" cy="48" rx="8" ry="6" fill="#1F2937"/>
    <!-- Woofer Cone (12" / 15") -->
    <circle cx="80" cy="98" r="26" fill="#030712" stroke="#374151" stroke-width="1.5"/>
    <!-- Woofer Rubber Surround -->
    <circle cx="80" cy="98" r="22" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <!-- Dust Cap with Highlight -->
    <circle cx="80" cy="98" r="9" fill="#1F2937" stroke="#4B5563" stroke-width="1"/>
    <circle cx="78" cy="96" r="3" fill="#6B7280" opacity="0.5"/>
    <!-- Power LED on Bottom -->
    <circle cx="80" cy="128" r="1.8" fill="#3B82F6"/>
  </g>
</svg>