<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="micBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="micGrille" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D1D5DB"/>
      <stop offset="40%" stop-color="#F3F4F6"/>
      <stop offset="70%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <filter id="micShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#micShadow)">
    <!-- Stand Post -->
    <rect x="77" y="118" width="6" height="28" fill="#111827"/>
    <rect x="66" y="142" width="28" height="6" rx="2" fill="#374151"/>
    <!-- Mic Swivel Mount -->
    <circle cx="80" cy="116" r="5" fill="#4B5563"/>
    <rect x="76" y="106" width="8" height="12" fill="#1F2937"/>
    <!-- Mic Barrel / Handle -->
    <path d="M72,56 L88,56 L85,108 L75,108 Z" fill="url(#micBody)" stroke="#111827" stroke-width="1.5"/>
    <rect x="73" y="78" width="14" height="6" fill="#111827"/>
    <line x1="77" y1="81" x2="83" y2="81" stroke="#F97316" stroke-width="1"/>
    <!-- Mic Grille Head -->
    <ellipse cx="80" cy="56" rx="13" ry="5" fill="#4B5563"/>
    <path d="M67,56 C67,38 72,25 80,25 C88,25 93,38 93,56 Z" fill="url(#micGrille)" stroke="#6B7280" stroke-width="1.2"/>
    <!-- Grille Mesh Ring -->
    <ellipse cx="80" cy="46" rx="12.5" ry="4" fill="none" stroke="#374151" stroke-width="1.2"/>
    <ellipse cx="80" cy="56" rx="13" ry="4.5" fill="none" stroke="#111827" stroke-width="1.5"/>
    <!-- Shure-style Acoustic Foam Texture Lines -->
    <line x1="74" y1="30" x2="86" y2="30" stroke="#4B5563" stroke-width="0.8" opacity="0.6"/>
    <line x1="71" y1="37" x2="89" y2="37" stroke="#4B5563" stroke-width="0.8" opacity="0.6"/>
  </g>
</svg>