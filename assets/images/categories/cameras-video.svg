<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="camBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#0284C7"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="camShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <g filter="url(#camShadow)" transform="translate(0, 4)">
    <!-- Camera Body -->
    <rect x="34" y="52" width="92" height="64" rx="8" fill="url(#camBody)" stroke="#111827" stroke-width="1.8"/>
    <!-- Textured Right Handgrip -->
    <rect x="108" y="54" width="16" height="60" rx="4" fill="#111827"/>
    <line x1="112" y1="60" x2="112" y2="108" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="116" y1="60" x2="116" y2="108" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="120" y1="60" x2="120" y2="108" stroke="#374151" stroke-width="1" stroke-dasharray="2 2"/>
    <!-- Top Viewfinder Hump (Pentaprism) -->
    <polygon points="62,52 90,52 86,38 66,38" fill="#1F2937" stroke="#111827" stroke-width="1.2"/>
    <!-- Hot Shoe for Mic/Light -->
    <rect x="71" y="34" width="10" height="4" rx="0.5" fill="#94A3B8"/>
    <!-- Mode Dial & Shutter Button -->
    <rect x="42" y="47" width="10" height="5" rx="1" fill="#4B5563"/>
    <rect x="110" y="47" width="8" height="5" rx="1" fill="#CBD5E1"/>
    <circle cx="114" cy="46" r="3" fill="#DC2626"/>
    <!-- Front Lens Outer Barrel -->
    <circle cx="76" cy="84" r="26" fill="#111827" stroke="#4B5563" stroke-width="2"/>
    <circle cx="76" cy="84" r="22" fill="#1F2937" stroke="#64748B" stroke-width="1"/>
    <!-- Lens Elements & Glass Reflection -->
    <circle cx="76" cy="84" r="17" fill="url(#lensGlass)"/>
    <ellipse cx="71" cy="79" rx="6" ry="4" fill="#FFFFFF" opacity="0.35" transform="rotate(-30 71 79)"/>
    <!-- Red Ring (Cinema / Pro Quality) -->
    <circle cx="76" cy="84" r="24.5" fill="none" stroke="#EF4444" stroke-width="1"/>
  </g>
</svg>