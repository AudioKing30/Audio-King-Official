<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="vaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="vaPlus" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="vaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#vaShadow)" transform="translate(0, 0)">
    <!-- Outer Base Circle -->
    <circle cx="80" cy="80" r="44" fill="url(#vaBg)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Inner Decorative Circle -->
    <circle cx="80" cy="80" r="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Plus Symbol -->
    <path d="M80,62 L80,98 M62,80 L98,80" stroke="url(#vaPlus)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>