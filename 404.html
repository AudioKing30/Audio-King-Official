<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioKing — Redirecting...</title>
  <script>
    // GitHub Pages SPA Single-Page Router Redirect
    (function() {
      var path = window.location.pathname;
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      
      // Extract repository base if hosted on GitHub Pages subfolder (e.g. /Audio-King-Official/)
      var repoSegment = '';
      var segments = path.split('/').filter(Boolean);
      if (segments.length > 0 && segments[0].toLowerCase() === 'audio-king-official') {
        repoSegment = '/' + segments[0];
        segments.shift();
      }
      
      var route = segments.join('/');
      
      if (route === 'login' || route === 'signin') {
        window.location.replace(repoSegment + '/#auth=signin');
      } else if (route === 'signup' || route === 'register') {
        window.location.replace(repoSegment + '/#auth=signup');
      } else if (route === 'admin/login' || route === 'admin/login.html') {
        window.location.replace(repoSegment + '/admin/login.html');
      } else if (route === 'admin' || route.startsWith('admin/')) {
        var adminSub = route.replace(/^admin\/?/, '');
        window.location.replace(repoSegment + '/#admin' + (adminSub ? '/' + adminSub : ''));
      } else if (route.startsWith('product')) {
        window.location.replace(repoSegment + '/#' + route + search + hash);
      } else if (route === 'catalog') {
        window.location.replace(repoSegment + '/#catalog' + search + hash);
      } else {
        window.location.replace(repoSegment + '/' + (hash || ''));
      }
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #07172C;
      color: #FFFFFF;
      text-align: center;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #F27021;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p { color: #94A3B8; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 600;">Redirecting to AudioKing...</h2>
    <p>Loading your pro audio experience</p>
  </div>
</body>
</html>
